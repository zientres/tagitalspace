name: Acton contract build

on:
  push:
    branches: [main]
    paths:
      - "Acton.toml"
      - "contracts/tolk/**"
      - "contracts/tests/**"
      - "tests/**"
      - ".github/workflows/acton-contracts.yml"
  pull_request:
    paths:
      - "Acton.toml"
      - "contracts/tolk/**"
      - "contracts/tests/**"
      - "tests/**"
      - ".github/workflows/acton-contracts.yml"

permissions: {}

jobs:
  build-and-check:
    name: Build and check Tolk contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Acton
        uses: ton-blockchain/setup-acton@0f9f436843d740466cae2d7411ff59072dde942e
        with:
          version: "1.2.1"

      - name: Build contracts
        run: acton build

      - name: Run Acton TVM tests
        run: acton test

      - name: Check Tolk formatting
        run: acton fmt --check contracts/tolk/TagitalSpaceRegistry.tolk contracts/tolk/PlateItem.tolk contracts/tolk/plate-item-state.tolk contracts/tolk/plate-item-auction.tolk

      - name: Lint Tolk contracts
        run: acton check --output-format github

      - name: Verify JavaScript specification checks
        run: |
          node --check contracts/tests/verify-vectors.mjs
          node contracts/tests/verify-vectors.mjs
